# ~/.tmux.conf — no TPM, no plugins. Tokyo Night colors hardcoded.
# Needs tmux ≥ 3.2 (RHEL 9, Ubuntu 22.04, Debian 12 and newer).
#
# Quick reference (prefix = C-b):
#   \  -        split horiz / vert (keeps cwd)       h j k l   select pane
#   H J K L     resize pane (repeatable)             m / z     zoom pane
#   e           TOGGLE BROADCAST (sync panes)        < >       move window left/right
#   M           swap window with index (prompt)      W         move window to session
#   @           pull a pane in from another window   !         break pane to new window
#   { }         swap pane with prev/next             r         reload config
#   F12 (no prefix) suspend this tmux so keys pass to a nested/remote tmux

# ─── Terminal ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*-256color:RGB,xterm-kitty:RGB,alacritty:RGB,foot:RGB"
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on            # OSC52: copy reaches local clipboard over ssh
set -g history-limit 50000
set -g mouse on

# ─── Prefix & reload ─────────────────────────────────────
set -g prefix C-b
bind C-b send-prefix               # C-b C-b sends prefix to a nested tmux
bind r source-file ~/.tmux.conf \; display "config reloaded"

# ─── Windows / panes numbering ───────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on

# ─── Splits (open in current dir) ────────────────────────
unbind %
unbind '"'
bind '\' split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind c  new-window -c "#{pane_current_path}"

# ─── Pane navigation / resize ────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# ─── Moving windows & panes ──────────────────────────────
# Shift window left/right in the bar, focus follows it.
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind M command-prompt -p "swap window with index:" "swap-window -d -t '%%'"
bind W command-prompt -p "move window to session:" "move-window -t '%%:'"
# Pull a pane from another window into this one (side by side).
bind @ command-prompt -p "join pane from window:" "join-pane -h -s ':%%'"
# '!' (break-pane) and '{' '}' (swap-pane) are tmux defaults.

# ─── Broadcast (cssh-style) ──────────────────────────────
# prefix+e toggles synchronize-panes for the current window. While on,
# borders turn red and the status bar shows BROADCAST.
bind e setw synchronize-panes \; display "broadcast #{?synchronize-panes,ON,OFF}"

# ─── Nested tmux (local tmux → ssh jumpbox → remote tmux) ─
# F12 suspends THIS tmux: prefix goes dead, every key passes through to the
# inner session. F12 again restores. Status bar shows NESTED while off.
bind -T root F12 \
    set prefix None \; \
    set key-table off \; \
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
    refresh-client -S
bind -T off F12 \
    set -u prefix \; \
    set -u key-table \; \
    refresh-client -S

# ─── Copy mode (vi) ──────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
unbind -T copy-mode-vi MouseDragEnd1Pane     # don't exit copy mode on mouse release

# ─── Popups (silently no-op if the tool isn't installed) ─
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "command -v lazygit >/dev/null && lazygit"

# ─── Tokyo Night (night) ─────────────────────────────────
# bg #1a1b26  bg_dark #16161e  bg_hl #292e42  border #3b4261  fg #c0caf5
# comment #565f89  blue #7aa2f7  magenta #bb9af7  green #9ece6a  red #f7768e  orange #ff9e64
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g message-style "bg=#292e42,fg=#7aa2f7"
set -g message-command-style "bg=#292e42,fg=#7aa2f7"
setw -g mode-style "bg=#283457,fg=#c0caf5"

setw -g pane-border-style        "#{?synchronize-panes,fg=#f7768e,fg=#3b4261}"
setw -g pane-active-border-style "#{?synchronize-panes,fg=#f7768e,fg=#7aa2f7}"
setw -g pane-border-lines heavy

set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold] #S #[default] "
set -g status-right "\
#{?#{==:#{client_key_table},off},#[bg=#ff9e64#,fg=#16161e#,bold] NESTED #[default] ,}\
#{?synchronize-panes,#[bg=#f7768e#,fg=#16161e#,bold] BROADCAST #[default] ,}\
#{?client_prefix,#[bg=#bb9af7#,fg=#16161e#,bold] PREFIX #[default] ,}\
#[fg=#565f89]#h #[bg=#292e42,fg=#7aa2f7] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#565f89] #I #W#{?window_zoomed_flag, (z),} "
setw -g window-status-current-format "#[bg=#292e42,fg=#7aa2f7,bold] #I #W#{?window_zoomed_flag, (z),}#{?pane_synchronized, (b),} "
setw -g window-status-activity-style "fg=#e0af68"

# Machine-local overrides (never committed)
source-file -q ~/.tmux.local.conf
